<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيد ميلاد سعيد فجر 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1B1440;
  --violet:#6C4AB6;
  --pink:#FF6FA0;
  --coral:#FF9466;
  --gold:#FFD66B;
  --cream:#FFF6EC;
  --plum:#3B2260;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; min-height:100%;}
body{
  font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  color:var(--cream);
  position:relative;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
:focus-visible{outline:3px solid var(--gold); outline-offset:3px; border-radius:6px;}

.sky{
  position:fixed; inset:0; z-index:0;
  background:linear-gradient(180deg,#1B1440 0%,#3B2A78 22%,#7A4FA8 42%,#D5568F 62%,#FF8C6B 80%,#FFD46B 100%);
  overflow:hidden;
}
.sky::after{
  content:'';
  position:absolute; left:50%; bottom:-25%;
  width:80vmax; height:80vmax;
  transform:translate(-50%,25%);
  background:radial-gradient(circle, rgba(255,224,150,.55) 0%, rgba(255,224,150,0) 65%);
  transition:transform 2.6s ease;
}
.sky.dawn::after{ transform:translate(-50%,5%); }

.stars{ position:absolute; inset:0 0 45% 0; transition:opacity 3s ease; }
.stars.fade{ opacity:0; }
.star{ position:absolute; border-radius:50%; background:var(--cream); animation:twinkle 2.2s ease-in-out infinite; }
@keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:1;}}

#confetti-canvas{ position:fixed; inset:0; z-index:8; pointer-events:none; }

.gate{
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1.1rem; text-align:center; padding:2rem;
  background:rgba(20,14,50,.4); backdrop-filter:blur(3px);
  transition:opacity .8s ease, visibility .8s ease;
}
.gate.hide{ opacity:0; visibility:hidden; pointer-events:none; }
.gate .emoji{ font-size:3rem; }
.gate h2{
  font-family:'Lalezar',cursive; font-weight:400;
  font-size:clamp(1.7rem,7vw,2.75rem); line-height:1.25; margin:0;
  text-shadow:0 2px 6px rgba(20,8,40,.5), 0 8px 26px rgba(30,15,60,.4);
}
.gate p{ max-width:24rem; opacity:.92; line-height:1.8; font-size:1rem; margin:0; }
.start-btn{
  margin-top:.4rem; font-weight:700; font-size:1.05rem;
  color:var(--plum); background:var(--gold);
  border-radius:999px; padding:1rem 2.4rem;
  box-shadow:0 12px 28px rgba(255,214,107,.4);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

.scene{
  position:relative; z-index:5;
  min-height:100vh; min-height:100svh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1.05rem; padding:3.5rem 1.25rem 4.5rem; text-align:center;
}
.mute-btn{
  position:fixed; top:1rem; left:1rem; z-index:15;
  width:2.6rem; height:2.6rem; border-radius:50%;
  background:rgba(255,255,255,.14); backdrop-filter:blur(4px);
  font-size:1.15rem; display:flex; align-items:center; justify-content:center;
}
.eyebrow{
  font-size:.85rem; text-transform:uppercase;
  opacity:.75; font-family:'Tajawal',sans-serif; font-weight:700; margin:0;
}
.title{
  font-family:'Lalezar',cursive; font-weight:400; margin:0;
  font-size:clamp(2.3rem,9vw,4.4rem); line-height:1.18;
  text-shadow:0 2px 6px rgba(20,8,40,.55), 0 8px 30px rgba(30,15,60,.4);
}
.subtitle{
  font-family:'Tajawal',sans-serif; font-weight:500; margin:0;
  font-size:clamp(1.05rem,3.2vw,1.3rem); opacity:.96;
  text-shadow:0 2px 10px rgba(20,8,40,.4);
}
.cake-wrap{
  position:relative; width:min(88vw,400px);
  margin:1.4rem auto .2rem;
}
.cake-btn{ display:block; width:100%; border-radius:20px; }
.cake-btn svg{ width:100%; height:auto; display:block; filter:drop-shadow(0 20px 26px rgba(15,8,35,.4)); }
.cat{ position:absolute; width:25%; bottom:2%; }
.cat.left{ left:-6%; }
.cat.right{ right:-6%; transform:scaleX(-1); }
.flame{ animation:flicker 1.5s ease-in-out infinite; transform-origin:50% 92%; }
.flame.out{ animation:none; opacity:0; transform:scale(.2,.2) translateY(8px); transition:opacity .45s ease, transform .45s ease; }
@keyframes flicker{
  0%,100%{ transform:scale(1,1) rotate(-3deg); }
  50%{ transform:scale(1.1,.92) rotate(3deg); }
}
.hint{ font-size:.95rem; opacity:.88; margin:0; animation:floaty 2.6s ease-in-out infinite; text-shadow:0 2px 10px rgba(20,8,40,.4); transition:opacity .3s ease; }
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}

.message{
  margin-top:.6rem; max-width:28rem;
  background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(8px); border-radius:22px; padding:1.6rem 1.8rem;
  opacity:0; transform:translateY(16px) scale(.96);
  transition:opacity .6s ease, transform .6s ease;
}
.message.show{ opacity:1; transform:translateY(0) scale(1); }
.message-main{
  font-family:'Lalezar',cursive; font-weight:400;
  font-size:clamp(1.5rem,5vw,2rem); margin:0 0 .5rem;
}
.message-sub{ font-family:'Tajawal',sans-serif; line-height:1.9; font-size:1rem; opacity:.96; margin:0; }
.signature{ font-family:'Tajawal',sans-serif; font-weight:700; font-size:1.1rem; color:var(--gold); margin-top:1rem; text-shadow:0 2px 4px rgba(20,8,40,.4); }

@media (prefers-reduced-motion: reduce){
  .star, .start-btn, .hint, .flame{ animation:none !important; }
}
</style>
</head>

<script>
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const starsEl = document.getElementById('stars');
  const starCount = reduceMotion ? 16 : 40;
  for(let i=0;i<starCount;i++){
    const s = document.createElement('span');
    s.className = 'star';
    const size = (1.4 + Math.random()*2).toFixed(1);
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = (Math.random()*100).toFixed(1)+'%';
    s.style.top = (Math.random()*60).toFixed(1)+'%';
    s.style.animationDelay = (Math.random()*2.2).toFixed(2)+'s';
    s.style.animationDuration = (1.8+Math.random()*2).toFixed(2)+'s';
    starsEl.appendChild(s);
  }

  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let W,H;
  function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const palette = ['#FF6FA0','#FF9466','#FFD66B','#C9A7EB','#FFF6EC','#8A4FB0'];
  let particles = [];

  function spawnConfetti(n){
    for(let i=0;i<n;i++){
      particles.push({
        kind:'confetti',
        x:Math.random()*W, y:-20-Math.random()*H,
        vx:(Math.random()-0.5)*0.9, vy:1.6+Math.random()*2,
        size:5+Math.random()*6, rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.18,
        color:palette[Math.floor(Math.random()*palette.length)],
        shape:Math.random()<0.5?'rect':'circle'
      });
    }
  }
  function spawnBurst(x,y,n){
    for(let i=0;i<n;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 2+Math.random()*6.5;
      particles.push({
        kind:'burst', x,y,
        vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
        size:3+Math.random()*4, rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.3,
        color:palette[Math.floor(Math.random()*palette.length)],
        shape:Math.random()<0.5?'rect':'circle',
        life:1
      });
    }
  }

  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const p of particles){
      if(p.kind==='confetti'){
        p.x += p.vx + Math.sin((p.y+p.x)*0.01);
        p.y += p.vy;
        p.rot += p.vr;
        if(p.y > H + 20){ p.y = -20; p.x = Math.random()*W; }
      } else {
        p.vy += 0.12;
        p.vx *= 0.985;
        p.x += p.vx; p.y += p.vy;
        p.rot += p.vr;
        p.life -= 0.014;
      }
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.kind==='burst' ? Math.max(p.life,0) : 0.85;
      ctx.fillStyle = p.color;
      if(p.shape==='rect') ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*0.6);
      else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
    particles = particles.filter(p=> p.kind==='confetti' || p.life>0);
    requestAnimationFrame(tick);
  }
  tick();

  let fireworkTimer;
  function ambientFirework(){
    if(!document.hidden){
      const x = W*0.15 + Math.random()*W*0.7;
      const y = H*0.12 + Math.random()*H*0.32;
      spawnBurst(x,y, reduceMotion?8:22);
    }
    fireworkTimer = setTimeout(ambientFirework, 2600+Math.random()*2600);
  }

  let audioCtx, masterGain, muted = false;
  const freq = { G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99 };
  const melody = [
    ['G4',.5],['G4',.5],['A4',1],['G4',1],['C5',1],['B4',2],
    ['G4',.5],['G4',.5],['A4',1],['G4',1],['D5',1],['C5',2],
    ['G4',.5],['G4',.5],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
    ['F5',.5],['F5',.5],['E5',1],['C5',1],['D5',1],['C5',2]
  ];
  const TEMPO = 0.36;

  function playNote(f, start, dur){
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = f;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.2, start+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, start+dur);
    osc.connect(g).connect(masterGain);
    osc.start(start);
    osc.stop(start+dur+0.05);
  }
  function playLoop(){
    if(!audioCtx) return;
    let t = audioCtx.currentTime + 0.15;
    let beats = 0;
    melody.forEach(([n,b])=>{
      playNote(freq[n], t, b*TEMPO*0.92);
      t += b*TEMPO; beats += b;
    });
    setTimeout(playLoop, (beats*TEMPO*1000) + 900);
  }

  const gate = document.getElementById('gate');
  const startBtn = document.getElementById('startBtn');
  const sky = document.getElementById('sky');
  const scene = document.getElementById('scene');
  const muteBtn = document.getElementById('muteBtn');
  const cakeBtn = document.getElementById('cakeBtn');
  const hint = document.getElementById('hint');
  const messageEl = document.getElementById('message');

  let candlesBlown = false;

  startBtn.addEventListener('click', () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);
    playLoop();

    gate.classList.add('hide');
    gate.setAttribute('inert','');
    scene.removeAttribute('inert');
    sky.classList.add('dawn');
    starsEl.classList.add('fade');

    spawnConfetti(reduceMotion?22:65);
    spawnBurst(W/2, H*0.32, reduceMotion?18:55);
    ambientFirework();
  }, { once:true });

  function celebrateBurst(){
    const r = cakeBtn.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    spawnBurst(cx,cy, reduceMotion?22:65);
    setTimeout(()=>spawnBurst(cx-70,cy-40, reduceMotion?10:30), 160);
    setTimeout(()=>spawnBurst(cx+70,cy-30, reduceMotion?10:30), 320);
  }

  cakeBtn.addEventListener('click', () => {
    if(candlesBlown) return;
    candlesBlown = true;
    document.querySelectorAll('.flame').forEach(f=>f.classList.add('out'));
    hint.style.opacity = '0';
    celebrateBurst();
    setTimeout(()=>{
      messageEl.hidden = false;
      requestAnimationFrame(()=> messageEl.classList.add('show'));
    }, 500);
  });

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    if(masterGain) masterGain.gain.setValueAtTime(muted?0:1, audioCtx.currentTime);
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? 'تشغيل الصوت' : 'كتم الصوت');
  });
})();
</script>
</body>
</html>
